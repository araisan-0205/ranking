<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- iPad・iPhoneでホーム画面に追加した時にブラウザ枠を完全に消す設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="砂時計タイマー">
<title>リアル砂時計タイマー</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0; height: 100vh; width: 100vw; background-color: #000000; color: #cbd5e1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;
  }

  .top-tools {
    position: fixed; top: clamp(10px, 2vh, 20px); right: clamp(10px, 2vw, 20px);
    display: flex; gap: 8px; z-index: 50;
  }
  .tool-btn {
    font-size: clamp(11px, 1.6vmin, 14px); padding: 6px 12px;
    background: rgba(15, 23, 42, 0.75); color: #94a3b8; border: 1px solid #1e293b;
    border-radius: 20px; cursor: pointer; transition: all 0.2s;
  }
  .tool-btn:hover { background: #1e293b; color: #f8fafc; }

  .main-layout {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; padding: 3vmin; gap: 2vmin;
  }
  .left-pane, .right-pane {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  @media (orientation: landscape) and (min-width: 560px) {
    .main-layout {
      flex-direction: row; justify-content: space-evenly; padding: 4vmin 6vmin;
    }
    .left-pane {
      flex: 1; height: 100%; justify-content: center; align-items: center;
    }
    .right-pane {
      flex: 1; height: 100%; justify-content: center; align-items: center;
    }
  }

  .ui-collapsible {
    transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease;
    max-height: 220px; opacity: 1; overflow: hidden;
  }
  body.clean-mode .ui-collapsible {
    opacity: 0; max-height: 0; margin: 0 !important; pointer-events: none;
  }

  .settings {
    margin-bottom: 14px; font-size: clamp(13px, 2vmin, 16px);
    color: #94a3b8; background: #0a0c10; padding: 10px 18px;
    border-radius: 14px; border: 1px solid #1e293b;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .settings input[type="number"] {
    width: 52px; font-size: clamp(14px, 2.2vmin, 18px); text-align: center;
    padding: 4px; background: #000; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px;
  }

  #display {
    font-size: clamp(54px, 13vmin, 130px); font-weight: bold; line-height: 1.05;
    font-variant-numeric: tabular-nums; color: #cbd5e1; letter-spacing: 0.02em;
  }

  .mode-box {
    display: flex; flex-direction: column; align-items: center;
    margin-top: clamp(8px, 1.8vh, 18px); margin-bottom: clamp(12px, 2.2vh, 22px);
  }
  #status {
    font-size: clamp(15px, 2.5vmin, 24px); font-weight: bold;
    padding: 6px 22px; border-radius: 24px; letter-spacing: 0.08em;
    background: rgba(214, 188, 148, 0.12); color: #d6bc94; border: 1px solid rgba(214, 188, 148, 0.3);
  }
  .break #status {
    background: rgba(148, 163, 184, 0.12); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3);
  }
  #cycle {
    font-size: clamp(12px, 1.8vmin, 16px); color: #64748b; margin-top: 6px;
  }

  .controls { display: flex; gap: 10px; justify-content: center; }
  .ctrl-btn {
    font-size: clamp(13px, 1.9vmin, 16px); padding: clamp(9px, 1.5vmin, 13px) clamp(16px, 2.5vmin, 24px);
    cursor: pointer; border: 1px solid #1e293b; border-radius: 12px;
    font-weight: bold; color: #cbd5e1; background: #0f172a;
  }
  .ctrl-btn:hover { background: #1e293b; }
  .start { border-color: #1d4ed8; color: #60a5fa; }
  .stop { border-color: #b91c1c; color: #f87171; }

  .stage {
    position: relative;
    width: clamp(220px, 52vmin, 480px);
    height: clamp(250px, 62vmin, 560px);
    display: flex; justify-content: center; align-items: center;
  }
  .hg-pivot {
    position: relative; width: 78%; height: 92%;
    display: flex; justify-content: center; align-items: center;
    transition: transform 1.6s cubic-bezier(0.45, 0.05, 0.25, 1);
  }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head><body class="work">

<div class="top-tools">
  <button class="tool-btn" id="toggleUiBtn" onclick="toggleCleanMode()">👁️ ボタンを隠す</button>
  <button class="tool-btn" id="fsBtn" onclick="toggleFullscreen()">⛶ 全画面</button>
</div>

<div class="main-layout">
  <div class="left-pane">
    <div class="ui-collapsible">
      <div class="settings">
        <span>勉強 <input type="number" id="wIn" value="45" min="1" max="180"> 分</span>
        <span>休憩 <input type="number" id="bIn" value="5" min="1" max="60"> 分</span>
      </div>
    </div>

    <div id="display">45:00</div>

    <div class="mode-box">
      <div id="status">⏳ 勉強モード</div>
      <div id="cycle">現在：1セット目</div>
    </div>

    <div class="ui-collapsible">
      <div class="controls">
        <button class="ctrl-btn start" onclick="start()">スタート</button>
        <button class="ctrl-btn stop" onclick="stop()">一時停止</button>
        <button class="ctrl-btn" onclick="reset()">リセット</button>
      </div>
    </div>
  </div>

  <div class="right-pane">
    <div class="stage">
      <div class="hg-pivot" id="hgPivot">
        <canvas id="sandCanvas" width="240" height="280"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('sandCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const CX = W / 2, CY = H / 2;

  const getWorkMin = () => Math.max(1, parseInt(document.getElementById('wIn').value) || 45);
  const getBreakMin = () => Math.max(1, parseInt(document.getElementById('bIn').value) || 5);

  let isWork = true;
  let totalMs = getWorkMin() * 60 * 1000;
  let remMs = totalMs;
  let lastTick = null;
  let lastSecDisplayed = -1;
  let count = 1;
  let running = false;
  let isFlipping = false;

  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function chime() {
    initAudio();
    const now = audioCtx.currentTime;
    const notes = isWork
      ? [523.25, 659.25, 783.99, 1046.50]
      : [880.00, 698.46, 587.33, 523.25];

    notes.forEach((freq, i) => {
      const startTime = now + i * 0.22;
      const duration = 0.95;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(freq, startTime);

      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 2, startTime);

      const subGain = audioCtx.createGain();
      subGain.gain.setValueAtTime(0.25, startTime);

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(0.45, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc1.connect(gain);
      osc2.connect(subGain);
      subGain.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(startTime);
      osc1.stop(startTime + duration);
      osc2.start(startTime);
      osc2.stop(startTime + duration);
    });
  }
  let textureGrains = [];
  let fallingGrains = [];

  function initGrains() {
    textureGrains = [];
    for (let i = 0; i < 3400; i++) {
      textureGrains.push({ nx: (Math.random() - 0.5) * 2, ny: Math.random(), shade: Math.random() });
    }
    fallingGrains = [];
    for (let i = 0; i < 120; i++) {
      fallingGrains.push({ y: Math.random() * 116, vx: (Math.random() - 0.5) * 2.0, speed: 2.2 + Math.random() * 1.5, shade: Math.random() });
    }
  }

  function traceGlassPath() {
    ctx.beginPath();
    ctx.moveTo(CX - 82, CY - 116);
    ctx.bezierCurveTo(CX - 82, CY - 40, CX - 5.5, CY - 15, CX - 3.8, CY);
    ctx.bezierCurveTo(CX - 5.5, CY + 15, CX - 82, CY + 40, CX - 82, CY + 116);
    ctx.lineTo(CX + 82, CY + 116);
    ctx.bezierCurveTo(CX + 82, CY + 40, CX + 5.5, CY + 15, CX + 3.8, CY);
    ctx.bezierCurveTo(CX + 5.5, CY - 15, CX + 82, CY - 40, CX + 82, CY - 116);
    ctx.closePath();
  }

  function getSandColors() {
    return { base: '#c2a67d', dark: '#9e825b', light: '#d9c19c' };
  }

  function getMoundSurfaceY(absX, progress) {
    const bottomY = CY + 116;
    const peakHeight = Math.pow(progress, 0.58) * 112;
    const peakY = bottomY - peakHeight;
    const rawY = peakY + (absX * 82) * 0.62;
    return Math.min(bottomY, rawY);
  }

  function triggerFlip() {
    isFlipping = true;
    remMs = 0;
    updateUI(0);

    isWork = !isWork;
    if (isWork) count++;
    chime();

    const pivot = document.getElementById('hgPivot');
    pivot.style.transition = 'transform 1.6s cubic-bezier(0.45, 0.05, 0.25, 1)';
    pivot.style.transform = 'rotate(180deg)';

    setTimeout(() => {
      const nextMin = isWork ? getWorkMin() : getBreakMin();
      totalMs = nextMin * 60 * 1000;
      remMs = totalMs;

      pivot.style.transition = 'none';
      pivot.style.transform = 'rotate(0deg)';

      lastTick = performance.now();
      lastSecDisplayed = -1;
      isFlipping = false;
    }, 1650);
  }

  function loop(now) {
    if (running && !isFlipping) {
      if (lastTick !== null) {
        const dt = now - lastTick;
        remMs -= dt;
        if (remMs <= 0) triggerFlip();
      }
      lastTick = now;
    } else if (!running) {
      lastTick = null;
    }

    const currentSec = Math.ceil(remMs / 1000);
    if (currentSec !== lastSecDisplayed && !isFlipping) {
      lastSecDisplayed = currentSec;
      updateUI(currentSec);
    }

    render();
    requestAnimationFrame(loop);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    const progress = Math.max(0, Math.min(1, 1 - (remMs / totalMs)));
    const colors = getSandColors();

    const totalMinutes = totalMs / 60000;
    const flowFactor = Math.max(0.25, Math.min(1.0, 6 / Math.pow(totalMinutes, 0.65)));
    const streamWidth = 0.8 + flowFactor * 2.6;
    const activeGrainCount = Math.floor(20 + flowFactor * 100);

    ctx.save();
    traceGlassPath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
    ctx.fill();
    ctx.clip();

    if (progress < 0.9999) {
      const topLevel = CY - 112 + Math.pow(progress, 0.85) * 112;
      const dip = Math.sin(progress * Math.PI) * 12;

      ctx.beginPath();
      ctx.moveTo(CX - 86, topLevel);
      ctx.quadraticCurveTo(CX, topLevel + dip, CX + 86, topLevel);
      ctx.lineTo(CX + 86, CY);
      ctx.lineTo(CX - 86, CY);
      ctx.closePath();
      ctx.fillStyle = colors.base;
      ctx.fill();

      for (let i = 0; i < 1700; i++) {
        const g = textureGrains[i];
        const gy = topLevel + g.ny * (CY - topLevel);
        const gx = CX + g.nx * 82;
        if (gy > topLevel + (1 - Math.abs(g.nx)) * (dip * 0.55)) {
          ctx.fillStyle = g.shade > 0.5 ? colors.light : colors.dark;
          ctx.fillRect(gx, gy, 1.2, 1.2);
        }
      }
    }

    if (progress > 0.0001) {
      const bottomY = CY + 116;
      ctx.beginPath();
      ctx.moveTo(CX - 82, bottomY);

      const steps = 40;
      for (let s = 0; s <= steps; s++) {
        const nx = -1 + (s / steps) * 2;
        const px = CX + nx * 82;
        const py = getMoundSurfaceY(Math.abs(nx), progress);
        ctx.lineTo(px, py);
      }

      ctx.lineTo(CX + 82, bottomY);
      ctx.closePath();
      ctx.fillStyle = colors.base;
      ctx.fill();

      for (let i = 1700; i < 3400; i++) {
        const g = textureGrains[i];
        const surfaceY = getMoundSurfaceY(Math.abs(g.nx), progress);
        if (surfaceY < bottomY - 0.5) {
          const gy = surfaceY + g.ny * (bottomY - surfaceY);
          const gx = CX + g.nx * 82;
          ctx.fillStyle = g.shade > 0.5 ? colors.light : colors.dark;
          ctx.fillRect(gx, gy, 1.2, 1.2);
        }
      }
    }

    if (running && !isFlipping && remMs > 0) {
      const peakY = getMoundSurfaceY(0, progress);
      const fallHeight = Math.max(1, peakY - CY);

      ctx.fillStyle = colors.base;
      ctx.fillRect(CX - streamWidth / 2, CY, streamWidth, fallHeight);

      for (let i = 0; i < activeGrainCount; i++) {
        const fg = fallingGrains[i];
        fg.y = (fg.y + fg.speed) % fallHeight;
        const spread = (fg.y / 116) * (1.5 + flowFactor * 2.5);
        const fx = CX + fg.vx * spread;
        const fy = CY + fg.y;
        ctx.fillStyle = fg.shade > 0.5 ? colors.light : colors.dark;
        ctx.fillRect(fx, fy, 1.2, 1.2);
      }
    }

    ctx.restore();

    traceGlassPath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#334155';
    ctx.stroke();

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(CX - 90, CY - 124, 180, 8);
    ctx.fillRect(CX - 90, CY + 116, 180, 8);
  }

  function updateUI(sec) {
    const safeSec = Math.max(0, sec);
    const m = String(Math.floor(safeSec / 60)).padStart(2, '0');
    const s = String(safeSec % 60).padStart(2, '0');
    document.getElementById('display').textContent = `${m}:${s}`;
    document.title = `(${m}:${s}) ${isWork ? '勉強' : '休憩'}`;
    document.body.className = document.body.classList.contains('clean-mode')
      ? (isWork ? 'work clean-mode' : 'break clean-mode')
      : (isWork ? 'work' : 'break');
    document.getElementById('status').textContent = isWork ? '⏳ 勉強モード' : '🌿 休憩モード';
    document.getElementById('cycle').textContent = `現在：${count}セット目`;
  }

  function start() {
    initAudio();
    if (running) return;
    running = true;
    lastTick = performance.now();
  }

  function stop() {
    running = false;
    lastTick = null;
  }

  function reset() {
    stop();
    isFlipping = false;
    isWork = true;
    const pivot = document.getElementById('hgPivot');
    pivot.style.transition = 'none';
    pivot.style.transform = 'rotate(0deg)';
    totalMs = getWorkMin() * 60 * 1000;
    remMs = totalMs;
    count = 1;
    lastSecDisplayed = -1;
    updateUI(Math.ceil(remMs / 1000));
  }

  function toggleCleanMode() {
    document.body.classList.toggle('clean-mode');
    const isClean = document.body.classList.contains('clean-mode');
    document.getElementById('toggleUiBtn').textContent = isClean ? '⚙️ 設定を表示' : '👁️ ボタンを隠す';
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      document.getElementById('fsBtn').textContent = '🗗 全画面終了';
    } else {
      document.exitFullscreen();
      document.getElementById('fsBtn').textContent = '⛶ 全画面';
    }
  }

  document.getElementById('wIn').addEventListener('change', reset);
  document.getElementById('bIn').addEventListener('change', reset);

  initGrains();
  updateUI(Math.ceil(remMs / 1000));
  requestAnimationFrame(loop);
</script>
</body>
</html>
